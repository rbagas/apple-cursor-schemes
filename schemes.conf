# Colour schemes offered by this fork.
#
# Upstream marks the pointer body with #00FF00 and the outline with #0000FF in
# every SVG, so a scheme is exactly that pair. Anything not covered by those two
# colours (the drop shadow) belongs to the artwork.
#
# name|fill|outline|comment

macOS|#000000|#FFFFFF|Upstream macOS: black fill, white outline
macOS-White|#FFFFFF|#000000|Upstream inverted variant: white fill, black outline
GitHub-Dark|#24292f|#FFFFFF|GitHub Dark v1 graphite fill
Nord|#4c566a|#eceff4|Nord Polar Night slate fill
Dracula|#44475a|#f8f8f2|Dracula current-line fill
Catppuccin-Mocha|#cba6f7|#1e1e2e|Catppuccin Mocha mauve fill
Tokyo-Night|#1a1b26|#7aa2f7|Tokyo Night canvas fill, blue outline
